            <h1>Zakazivanje treninga i konsultacija</h1>
            <p>Popuni formu i zakaži uvodni razgovor za personalni trening ili plan ishrane u teretani.</p>

            <form id="bookingForm" class="booking-form">
                <label for="ime">Ime i prezime:</label>
                <input type="text" id="ime" required>

                <label for="email">Email adresa:</label>
                <input type="email" id="email" required>

                <label for="paket">Izaberite paket:</label>
                <select id="paket">
                    <option value="Start">Start Paket</option>
                    <option value="Pro">Pro Paket</option>
                    <option value="Online">Online Paket</option>
                </select>

                <label for="poruka">Vaš cilj / napomena:</label>
                <textarea id="poruka" rows="4"></textarea>

                <button type="submit" class="btn">Pošalji zahtev</button>
            </form>
            <p id="formMessage" class="form-msg"></p>
        </div>
